services:
  db:
    image: postgres:17-alpine
    container_name: careerbridge-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: careerbridge
      POSTGRES_PASSWORD: careerbridge_dev_password
      POSTGRES_DB: careerbridge_db

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - careerbridge_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U careerbridge -d careerbridge_db
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  careerbridge_postgres_data: